name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-bump
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  auto-release:
    name: Auto Release
    if: |
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release/patch') ||
       contains(github.event.pull_request.labels.*.name, 'release/minor') ||
       contains(github.event.pull_request.labels.*.name, 'release/major'))
    runs-on: ubuntu-latest
    outputs:
      tag: v${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for batch window
        run: sleep 120

      - name: Wait for CI on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          echo "Main SHA: $MAIN_SHA"

          for i in {1..20}; do
            CI_RUN=$(gh run list --workflow ci.yml --branch main --commit "$MAIN_SHA" --event push \
              --json databaseId,status,conclusion --limit 1 --jq '.[0] // {}')
            STATUS=$(echo "$CI_RUN" | jq -r '.status // "pending"')
            CONCLUSION=$(echo "$CI_RUN" | jq -r '.conclusion // ""')

            echo "CI status: $STATUS ${CONCLUSION:+($CONCLUSION)}"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                git reset --hard "$MAIN_SHA"
                exit 0
              fi
              echo "CI completed with conclusion: $CONCLUSION"
              exit 1
            fi

            sleep 30
          done
          echo "Timed out waiting for CI on $MAIN_SHA"
          exit 1

      - name: Determine release type
        id: release-type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          rm -f /tmp/bump_types
          touch /tmp/bump_types

          if [ -n "$LAST_TAG" ]; then
            for pr_num in $(git log "$LAST_TAG"..HEAD --oneline | grep -oE '#[0-9]+' | tr -d '#' | sort -u || true); do
              LABELS=$(gh pr view "$pr_num" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
              for label in $LABELS; do
                case "$label" in
                  release/major) echo "major" >> /tmp/bump_types ;;
                  release/minor) echo "minor" >> /tmp/bump_types ;;
                  release/patch) echo "patch" >> /tmp/bump_types ;;
                esac
              done
            done
          fi

          if [ -s /tmp/bump_types ]; then
            if grep -q "major" /tmp/bump_types; then
              BUMP="major"
            elif grep -q "minor" /tmp/bump_types; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          else
            if ${{ contains(github.event.pull_request.labels.*.name, 'release/major') }}; then
              BUMP="major"
            elif ${{ contains(github.event.pull_request.labels.*.name, 'release/minor') }}; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: mise run install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and create tag
        id: bump
        run: |
          set -euo pipefail
          npm version ${{ steps.release-type.outputs.bump }} --no-git-tag-version
          pnpm install --lockfile-only
          VERSION=$(node -p "require('./package.json').version")
          git add package.json pnpm-lock.yaml
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push changes and tag
        run: git push --atomic origin main "v${{ steps.bump.outputs.version }}"

  publish:
    name: Trigger release
    needs: auto-release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.auto-release.outputs.tag }}
        run: gh workflow run release.yml --ref main -f tag="$TAG"
