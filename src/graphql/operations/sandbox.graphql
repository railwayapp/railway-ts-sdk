fragment RailwaySandboxFields on Sandbox {
  id
  status
  environmentId
  region
  idleTimeoutMinutes
  createdAt
}

mutation RailwaySandboxCreate($input: SandboxCreateInput!) {
  sandboxCreate(input: $input) {
    ...RailwaySandboxFields
  }
}

mutation RailwaySandboxExec(
  $id: String!
  $environmentId: String!
  $command: String!
  $timeoutSec: Int
) {
  sandboxExec(
    id: $id
    environmentId: $environmentId
    command: $command
    timeoutSec: $timeoutSec
  ) {
    exitCode
    stdout
    stderr
    truncated
    timedOut
  }
}

mutation RailwaySandboxDestroy($id: String!, $environmentId: String!) {
  sandboxDestroy(id: $id, environmentId: $environmentId) {
    ...RailwaySandboxFields
  }
}
