fragment RailwaySandboxFields on Sandbox {
  id
  status
  networkIsolation
  environmentId
  region
  idleTimeoutMinutes
  createdAt
}

query RailwaySandbox($environmentId: String!, $id: String!) {
  sandbox(environmentId: $environmentId, id: $id) {
    ...RailwaySandboxFields
  }
}

query RailwaySandboxes(
  $environmentId: String!
  $first: Int
  $after: String
  $before: String
  $last: Int
) {
  sandboxes(
    environmentId: $environmentId
    first: $first
    after: $after
    before: $before
    last: $last
  ) {
    edges {
      node {
        ...RailwaySandboxFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

mutation RailwaySandboxCreate($input: SandboxCreateInput!) {
  sandboxCreate(input: $input) {
    ...RailwaySandboxFields
  }
}

mutation RailwaySandboxDestroy($id: String!, $environmentId: String!) {
  sandboxDestroy(id: $id, environmentId: $environmentId) {
    ...RailwaySandboxFields
  }
}

fragment RailwaySandboxTemplateFields on SandboxTemplate {
  id
  status
  environmentId
}

mutation RailwaySandboxTemplateBuild(
  $environmentId: String!
  $input: SandboxTemplateInput!
) {
  sandboxTemplateBuild(environmentId: $environmentId, input: $input) {
    ...RailwaySandboxTemplateFields
  }
}

query RailwaySandboxTemplate($environmentId: String!, $id: ID!) {
  sandboxTemplate(environmentId: $environmentId, id: $id) {
    ...RailwaySandboxTemplateFields
  }
}
