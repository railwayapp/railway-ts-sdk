fragment RailwaySandboxFields on Sandbox {
  id
  status
  environmentId
  region
  idleTimeoutMinutes
  createdAt
}

query RailwaySandbox($environmentId: String!, $id: String!) {
  sandbox(environmentId: $environmentId, id: $id) {
    ...RailwaySandboxFields
  }
}

query RailwaySandboxes(
  $environmentId: String!
  $first: Int
  $after: String
  $before: String
  $last: Int
) {
  sandboxes(
    environmentId: $environmentId
    first: $first
    after: $after
    before: $before
    last: $last
  ) {
    edges {
      node {
        ...RailwaySandboxFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

mutation RailwaySandboxCreate($input: SandboxCreateInput!) {
  sandboxCreate(input: $input) {
    ...RailwaySandboxFields
  }
}

mutation RailwaySandboxExec(
  $id: String!
  $environmentId: String!
  $command: String!
  $timeoutSec: Int
) {
  sandboxExec(
    id: $id
    environmentId: $environmentId
    command: $command
    timeoutSec: $timeoutSec
  ) {
    exitCode
    stdout
    stderr
    truncated
    timedOut
  }
}

mutation RailwaySandboxDestroy($id: String!, $environmentId: String!) {
  sandboxDestroy(id: $id, environmentId: $environmentId) {
    ...RailwaySandboxFields
  }
}
