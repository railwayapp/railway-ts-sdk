fragment RailwaySandboxFields on Sandbox {
  id
  status
  networkIsolation
  environmentId
  region
  idleTimeoutMinutes
  createdAt
}

query RailwaySandbox($environmentId: String!, $id: String!) {
  sandbox(environmentId: $environmentId, id: $id) {
    ...RailwaySandboxFields
  }
}

query RailwaySandboxes(
  $environmentId: String!
  $first: Int
  $after: String
  $before: String
  $last: Int
) {
  sandboxes(
    environmentId: $environmentId
    first: $first
    after: $after
    before: $before
    last: $last
  ) {
    edges {
      node {
        ...RailwaySandboxFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

mutation RailwaySandboxCreate($input: SandboxCreateInput!) {
  sandboxCreate(input: $input) {
    ...RailwaySandboxFields
  }
}

mutation RailwaySandboxDestroy($id: String!, $environmentId: String!) {
  sandboxDestroy(id: $id, environmentId: $environmentId) {
    ...RailwaySandboxFields
  }
}

fragment RailwaySandboxTemplateBuildFields on SandboxTemplateBuild {
  id
  status
  environmentId
}

mutation RailwaySandboxTemplateBuild(
  $environmentId: String!
  $input: SandboxTemplateInput!
) {
  sandboxTemplateBuild(environmentId: $environmentId, input: $input) {
    ...RailwaySandboxTemplateBuildFields
  }
}

query RailwaySandboxTemplateBuildStatus($environmentId: String!, $id: ID!) {
  sandboxTemplateBuild(environmentId: $environmentId, id: $id) {
    ...RailwaySandboxTemplateBuildFields
  }
}

fragment RailwaySandboxCheckpointFields on SandboxCheckpoint {
  id
  key
  environmentId
  createdAt
}

query RailwaySandboxCheckpoints($environmentId: String!) {
  sandboxCheckpoints(environmentId: $environmentId) {
    ...RailwaySandboxCheckpointFields
  }
}

mutation RailwaySandboxCheckpointCreate(
  $environmentId: String!
  $name: String!
  $sandboxId: String!
) {
  sandboxCheckpointCreate(
    environmentId: $environmentId
    name: $name
    sandboxId: $sandboxId
  ) {
    ...RailwaySandboxCheckpointFields
  }
}

mutation RailwaySandboxCheckpointRename(
  $environmentId: String!
  $id: ID!
  $name: String!
) {
  sandboxCheckpointRename(environmentId: $environmentId, id: $id, name: $name) {
    ...RailwaySandboxCheckpointFields
  }
}

mutation RailwaySandboxCheckpointDelete($environmentId: String!, $id: ID!) {
  sandboxCheckpointDelete(environmentId: $environmentId, id: $id)
}
