[tools]
node = "24"
"npm:pnpm" = "11.3.0"

[env]
NODE_OPTIONS = "--use-system-ca"

[tasks.install]
description = "Install dependencies"
run = "pnpm install"

[tasks.build]
description = "Build the library"
run = "pnpm run build"

[tasks.dev]
description = "Watch-build the library"
run = "pnpm run dev"

[tasks.typecheck]
description = "Typecheck source, tests, and examples"
run = "pnpm run typecheck"

[tasks.test]
description = "Run offline tests, then the bounded live e2e task when .env provides credentials"
run = "if [ -f .env ]; then set -a; . ./.env; set +a; fi; if [ -n \"${RAILWAY_API_TOKEN:-}\" ] && [ -n \"${RAILWAY_ENVIRONMENT_ID:-}\" ]; then RAILWAY_API_TOKEN='' RAILWAY_ENVIRONMENT_ID='' pnpm run test && mise run e2e; else pnpm run test; fi"

[tasks.test-watch]
description = "Run unit tests in watch mode"
run = "pnpm run test:watch"

[tasks.e2e]
description = "Run live e2e suites with two workers against .env credentials"
run = "if [ -f .env ]; then set -a; . ./.env; set +a; fi; pnpm exec vitest run --config vitest.e2e.config.ts --maxWorkers=2 --minWorkers=2 --reporter=verbose"

[tasks.codegen]
description = "Regenerate GraphQL types from the configured schema"
run = "pnpm run codegen"

[tasks.fallow]
description = "Run Fallow codebase analysis after large changes"
run = "pnpm exec fallow --fail-on-issues"

[tasks.package-check]
description = "Validate the packed npm package"
depends = ["build"]
run = "pnpm run package:check"

[tasks.clean]
description = "Remove build/test artifacts"
run = "pnpm run clean"

[tasks.check]
description = "Run typecheck, offline unit tests, and build (forces e2e off — clears creds)"
depends = ["typecheck", "build"]
run = "RAILWAY_API_TOKEN='' RAILWAY_ENVIRONMENT_ID='' pnpm run test"

[tasks.example]
description = "Run the default manual example using .env credentials"
depends = ["example:quickstart"]

[tasks."example:quickstart"]
description = "Create a sandbox, exec a command, then destroy it using .env credentials"
run = "pnpm exec tsx examples/sandboxes/quickstart.ts"

[tasks."example:template"]
description = "Create a sandbox from a template, then destroy it using .env credentials"
run = "pnpm exec tsx examples/sandboxes/template.ts"

[tasks."example:checkpoint"]
description = "Checkpoint a sandbox, boot a clone from it by name, then delete the checkpoint using .env credentials"
run = "pnpm exec tsx examples/sandboxes/checkpoint.ts"

[tasks."example:exec"]
description = "Start a durable command, detach, and reattach by sessionName from a fresh connection"
run = "pnpm exec tsx examples/sandboxes/exec.ts"

[tasks."example:fork"]
description = "Create a sandbox, fork it, and read forked filesystem state using .env credentials"
run = "pnpm exec tsx examples/sandboxes/fork.ts"

[tasks."example:files"]
description = "Push, pull, stream, and manage sandbox files using .env credentials"
run = "pnpm exec tsx examples/sandboxes/files.ts"

[tasks."example:flags"]
description = "Exercise the flags SDK against live registry data from .env credentials"
depends = ["build"]
run = "if [ -f .env ]; then set -a; . ./.env; set +a; fi; pnpm exec tsx examples/flags/demo.ts"

[tasks."example:flags-quickstart"]
description = "Minimal flags quickstart using .env credentials"
depends = ["build"]
run = "if [ -f .env ]; then set -a; . ./.env; set +a; fi; pnpm exec tsx examples/flags/quickstart.ts"
