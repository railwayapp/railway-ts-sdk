[tools]
node = "24"
"npm:pnpm" = "11.3.0"

[env]
NODE_OPTIONS = "--use-system-ca"

[tasks.install]
description = "Install dependencies"
run = "pnpm install"

[tasks.build]
description = "Build the library"
run = "pnpm run build"

[tasks.dev]
description = "Watch-build the library"
run = "pnpm run dev"

[tasks.typecheck]
description = "Typecheck source, tests, and examples"
run = "pnpm run typecheck"

[tasks.test]
description = "Run unit tests"
run = "pnpm run test"

[tasks.test-watch]
description = "Run unit tests in watch mode"
run = "pnpm run test:watch"

[tasks.e2e]
description = "Run the live exec e2e against .env credentials (sets SANDBOX_E2E=1, uses the system CA store for dev certs)"
run = "if [ -f .env ]; then set -a; . ./.env; set +a; fi; SANDBOX_E2E=1 NODE_OPTIONS=--use-system-ca pnpm exec vitest run tests/exec.e2e.test.ts"

[tasks.codegen]
description = "Regenerate GraphQL types from the configured schema"
run = "pnpm run codegen"

[tasks.fallow]
description = "Run Fallow codebase analysis after large changes"
run = "pnpm exec fallow --fail-on-issues"

[tasks.package-check]
description = "Validate the packed npm package"
depends = ["build"]
run = "pnpm run package:check"

[tasks.clean]
description = "Remove build/test artifacts"
run = "pnpm run clean"

[tasks.check]
description = "Run typecheck, tests, and build"
depends = ["typecheck", "test", "build"]

[tasks.example]
description = "Run the default manual example using .env credentials"
depends = ["example:quickstart"]

[tasks."example:quickstart"]
description = "Create a sandbox, exec a command, then destroy it using .env credentials"
run = "pnpm exec tsx examples/sandboxes/quickstart.ts"

[tasks."example:template"]
description = "Create a sandbox from a template, then destroy it using .env credentials"
run = "pnpm exec tsx examples/sandboxes/template.ts"

[tasks."example:exec-long"]
description = "Stream a random 60-120s command and verify every log line arrives in order"
run = "pnpm exec tsx examples/sandboxes/exec-long.ts"

[tasks."example:exec-reattach"]
description = "Reattach to a running exec mid-command and verify the full log history is captured"
run = "pnpm exec tsx examples/sandboxes/exec-reattach.ts"

[tasks."example:exec-kill"]
description = "Kill a running command mid-stream and verify it terminates (vs detach, which keeps it running)"
run = "pnpm exec tsx examples/sandboxes/exec-kill.ts"

[tasks."example:exec-durable"]
description = "Reattach from a fresh Sandbox.connect twice: full replay vs resumeFromLastRead"
run = "pnpm exec tsx examples/sandboxes/exec-durable.ts"

